<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="__CSP__">
  <title>Agents GUI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="__MAIN_CSS_URI__">
</head>
<body data-locale="__LOCALE__">
  <svg class="brand-symbols" aria-hidden="true">
    <symbol id="agents-gui-logo" viewBox="0 0 24 24">
      <g stroke-linecap="butt">
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="7.54" y1="10.57" x2="10.46" y2="15.43"/>
        <line x1="16.46" y1="10.57" x2="13.54" y2="15.43"/>
      </g>
      <circle cx="6" cy="8" r="3"/>
      <circle cx="18" cy="8" r="3"/>
      <circle cx="12" cy="18" r="3"/>
    </symbol>
  </svg>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar-main">
        <div class="toolbar-session">
          <div class="provider-tabs" id="providerTabs" role="tablist" aria-label="Provider tabs" data-i18n-aria="provider.label"></div>
          <div class="provider-hint" id="providerHint" aria-live="polite"></div>
          <label class="thread-select">
            <span class="sr-only" data-i18n="history.label"></span>
            <select id="threadSelect" name="assistantThread" autocomplete="off" data-i18n-title="history.label"></select>
          </label>
          <label class="provider-native-select" hidden>
            <span class="sr-only" data-i18n="provider.label"></span>
            <select id="providerSelect" name="assistantProvider" autocomplete="off"></select>
          </label>
        </div>
        <div class="toolbar-cluster">
          <div class="toolbar-actions" role="toolbar" aria-label="Conversation actions" data-i18n-aria="toolbar.actions">
            <button class="tool-button" id="newChatBtn" data-i18n-title="history.newThread" aria-label="New session">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            </button>
            <button class="tool-button" id="deleteThreadBtn" data-i18n-title="history.delete" aria-label="Delete current session">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5v6M8 5.5v6M10.5 5.5v6M3.8 3.8h8.4M6.4 3.8V2.7h3.2v1.1M4.5 3.8l.4 9.5h6.2l.4-9.5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <section class="api-settings-page" id="apiProviderSettingsPage" aria-labelledby="settingsTitle" hidden>
      <div class="api-settings-panel">
        <header class="api-settings-header">
          <button class="api-settings-back tool-button" id="apiProviderSettingsClose" type="button" data-i18n-title="apiSettings.back" data-i18n-aria="apiSettings.back" aria-label="Back">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4 6 8l4 4"/></svg>
          </button>
          <div class="brand-mark settings-brand-mark" aria-label="Agents GUI" title="Agents GUI">
            <svg class="brand-logo" viewBox="0 0 24 24" aria-hidden="true">
              <use href="#agents-gui-logo"></use>
            </svg>
          </div>
          <div>
            <h2 id="settingsTitle" data-i18n="settings.title"></h2>
            <p data-i18n="settings.subtitle"></p>
          </div>
        </header>

        <div class="settings-layout">
          <nav class="settings-nav" id="settingsNav" aria-label="Settings sections" data-i18n-aria="settings.sections">
            <button class="settings-nav-item" id="settingsNavAgents" type="button" data-settings-section="agents" data-i18n-aria="settings.agents" aria-label="Agents">
              <span class="settings-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M8 2.7 3.5 5.2v5.5L8 13.3l4.5-2.6V5.2L8 2.7z"/><path d="M5.7 6.3h4.6M5.7 8h4.6M5.7 9.7h2.7"/></svg>
              </span>
              <span class="settings-nav-label" data-i18n="settings.agents"></span>
            </button>
            <button class="settings-nav-item" id="settingsNavApiProviders" type="button" data-settings-section="apiProviders" data-i18n-aria="settings.apiProviders" aria-label="API Providers">
              <span class="settings-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M3.2 5.2c0-1 2.1-1.9 4.8-1.9s4.8.9 4.8 1.9-2.1 1.9-4.8 1.9-4.8-.9-4.8-1.9z"/><path d="M3.2 5.2v3.1c0 1 2.1 1.9 4.8 1.9s4.8-.9 4.8-1.9V5.2"/><path d="M3.2 8.3v2.5c0 1 2.1 1.9 4.8 1.9s4.8-.9 4.8-1.9V8.3"/></svg>
              </span>
              <span class="settings-nav-label" data-i18n="settings.apiProviders"></span>
            </button>
            <button class="settings-nav-item" id="settingsNavCommitMessage" type="button" data-settings-section="commitMessage" data-i18n-aria="settings.commitMessage" aria-label="Commit Message">
              <span class="settings-nav-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M3.2 3.5h9.6v7.3H6.4L3.2 13V3.5z"/><path d="M5.4 6h5.2M5.4 8.2h3.8"/></svg>
              </span>
              <span class="settings-nav-label" data-i18n="settings.commitMessage"></span>
            </button>
          </nav>

          <div class="settings-content">
            <section class="settings-section-panel" id="settingsSectionAgents" data-settings-panel="agents">
              <div class="settings-section-heading">
                <h3 data-i18n="homeAgents.title"></h3>
                <p data-i18n="homeAgents.subtitle"></p>
              </div>
              <div class="home-agent-list" id="homeAgentList"></div>
              <footer class="settings-section-actions">
                <span id="homeAgentsSaveStatus" class="settings-save-status" aria-live="polite"></span>
                <button class="api-secondary-button" id="homeAgentsReset" type="button" data-i18n="homeAgents.showAll"></button>
                <button class="api-primary-button" id="homeAgentsSave" type="button" data-i18n="apiSettings.save"></button>
              </footer>
            </section>

            <section class="settings-section-panel api-provider-settings-section" id="settingsSectionApiProviders" data-settings-panel="apiProviders" hidden>
              <div class="api-settings-body">
                <aside class="api-provider-list-pane">
                  <div class="api-settings-section-title" data-i18n="apiSettings.providers"></div>
                  <div class="api-provider-list" id="apiProviderList" role="list"></div>
                  <button class="api-provider-add" id="apiProviderAdd" type="button" data-i18n="apiSettings.addProvider"></button>
                </aside>

                <form class="api-provider-form" id="apiProviderForm">
                  <div class="api-provider-grid">
                    <label class="api-field">
                      <span data-i18n="apiSettings.name"></span>
                      <input id="apiProviderName" autocomplete="off">
                    </label>
                    <label class="api-field">
                      <span data-i18n="apiSettings.protocol"></span>
                      <select id="apiProviderProtocol">
                        <option value="openai" data-i18n="apiSettings.protocolOpenAI"></option>
                        <option value="anthropic" data-i18n="apiSettings.protocolAnthropic"></option>
                      </select>
                    </label>
                    <label class="api-field">
                      <span data-i18n="apiSettings.baseUrl"></span>
                      <input id="apiProviderBaseUrl" autocomplete="off" spellcheck="false">
                    </label>
                    <label class="api-field">
                      <span data-i18n="apiSettings.apiKey"></span>
                      <input id="apiProviderApiKey" type="password" autocomplete="off" spellcheck="false">
                    </label>
                    <label class="api-field api-field-wide">
                      <span data-i18n="apiSettings.model"></span>
                      <div class="api-model-row">
                        <input id="apiProviderModel" list="apiProviderModelOptions" autocomplete="off" spellcheck="false" data-i18n-placeholder="apiSettings.modelPlaceholder">
                        <datalist id="apiProviderModelOptions"></datalist>
                        <button class="api-secondary-button" id="apiProviderFetchModels" type="button" data-i18n="apiSettings.fetchModels"></button>
                      </div>
                      <span class="api-model-status" id="apiProviderModelStatus" aria-live="polite"></span>
                    </label>
                  </div>

                  <label class="api-provider-enabled" hidden>
                    <input id="apiProviderEnabled" type="checkbox">
                    <span data-i18n="apiSettings.enabled"></span>
                  </label>

                  <input id="apiProviderApiKeyEnv" type="hidden">

                  <div class="api-settings-section api-advanced-settings" hidden>
                    <div class="api-settings-row-title">
                      <span data-i18n="apiSettings.extraEnv"></span>
                      <button class="api-link-button" id="apiProviderAddEnv" type="button" data-i18n="apiSettings.addEnv"></button>
                    </div>
                    <div class="api-extra-env-list" id="apiProviderExtraEnv"></div>
                  </div>

                  <div class="api-settings-section api-advanced-settings" hidden>
                    <div class="api-settings-section-title" data-i18n="apiSettings.binding"></div>
                    <label class="api-field">
                      <span data-i18n="apiSettings.globalDefault"></span>
                      <select id="apiProviderDefaultSelect"></select>
                    </label>
                    <div class="api-agent-bindings" id="apiProviderAgentBindings"></div>
                  </div>

                  <div class="api-settings-error" id="apiProviderSettingsError" role="alert" hidden></div>

                  <footer class="api-settings-footer">
                    <button class="api-danger-button" id="apiProviderDelete" type="button" data-i18n="apiSettings.deleteProvider"></button>
                    <span id="apiProviderSaveStatus" class="settings-save-status" aria-live="polite"></span>
                    <button class="api-secondary-button" id="apiProviderCancel" type="button" data-i18n="action.dismiss"></button>
                    <button class="api-primary-button" type="submit" data-i18n="apiSettings.save"></button>
                  </footer>
                </form>
              </div>
            </section>

            <section class="settings-section-panel" id="settingsSectionCommitMessage" data-settings-panel="commitMessage" hidden>
              <div class="settings-section-heading">
                <h3 data-i18n="commitSettings.title"></h3>
                <p data-i18n="commitSettings.subtitle"></p>
              </div>

              <div class="commit-settings-grid">
                <label class="api-field">
                  <span data-i18n="commitSettings.provider"></span>
                  <select id="commitMessageProviderSelect"></select>
                </label>
                <label class="api-field">
                  <span data-i18n="commitSettings.language"></span>
                  <select id="commitMessageLanguageSelect">
                    <option value="auto" data-i18n="commitSettings.languageAuto"></option>
                    <option value="zh-CN" data-i18n="commitSettings.languageZh"></option>
                    <option value="en" data-i18n="commitSettings.languageEn"></option>
                  </select>
                </label>
                <label class="api-field">
                  <span data-i18n="commitSettings.maxDiffChars"></span>
                  <input id="commitMessageMaxDiffChars" type="number" min="1000" step="1000" inputmode="numeric">
                </label>
              </div>

              <footer class="settings-section-actions">
                <span id="commitMessageSaveStatus" class="settings-save-status" aria-live="polite"></span>
                <button class="api-secondary-button" id="commitMessageReset" type="button" data-i18n="commitSettings.reset"></button>
                <button class="api-primary-button" id="commitMessageSave" type="button" data-i18n="apiSettings.save"></button>
              </footer>
            </section>
          </div>
        </div>
      </div>
    </section>

    <div class="main-content">
      <main class="messages" id="messages" aria-live="polite"></main>
      <aside class="sidebar" id="sidebar" role="complementary" aria-label="Info panel"></aside>
    </div>

    <footer class="composer">
      <section id="taskBoard" class="task-board" aria-live="polite" data-i18n-aria="taskBoard.label" hidden></section>
      <div class="claude-terminal-banner" id="claudeTerminalBanner" role="note" hidden>
        <svg class="claude-terminal-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.8 4.2h10.4v7.6H2.8z"/>
          <path d="M5 6.2l2 1.8-2 1.8M8 10h3"/>
        </svg>
        <span data-i18n="claude.terminalPreference"></span>
        <button class="claude-terminal-dismiss" id="claudeTerminalDismiss" type="button" aria-label="Dismiss" data-i18n-title="action.dismiss">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="codex-terminal-banner" id="codexTerminalBanner" role="status" hidden>
        <div class="codex-terminal-status">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.8 4.2h10.4v7.6H2.8z"/>
            <path d="M5 6.3 6.8 8 5 9.7M8 10h3"/>
          </svg>
          <span data-i18n="codex.terminalRunning"></span>
        </div>
        <div class="codex-terminal-actions">
          <button class="codex-terminal-stop" id="codexTerminalStop" type="button" aria-label="Stop" data-i18n-title="action.stop">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 6h4v4H6z"/></svg>
          </button>
          <button class="codex-terminal-open" id="codexTerminalOpen" type="button" aria-label="Details" data-i18n-title="codex.terminalDetails">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 4.5 10 8l-3.5 3.5"/></svg>
          </button>
        </div>
      </div>
      <div class="slash-palette" id="slashPalette" role="listbox" aria-label="Slash commands" data-i18n-aria="slash.label" hidden></div>
      <div class="prompt-shell">
        <textarea id="promptInput" name="assistantPrompt" autocomplete="off" rows="1" data-i18n-placeholder="input.placeholder"></textarea>
        <div class="attachment-strip" id="attachmentStrip" aria-live="polite" data-i18n-aria="attachment.label" hidden></div>

        <div class="prompt-actions">
          <div class="prompt-selectors">
            <button class="attach-button" id="attachImageBtn" type="button" data-i18n-title="attachment.add" aria-label="Attach image">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
            </button>
            <button class="claude-tool-button" id="claudeSlashBtn" type="button" data-i18n-title="slash.label" aria-label="Slash commands">
              <span class="claude-slash-glyph" aria-hidden="true">/</span>
            </button>
            <input id="imageFileInput" type="file" accept="image/*" multiple hidden>
            <div class="composer-meta">
              <div class="context-budget" id="contextBudget" tabindex="0" role="status" aria-live="polite" data-i18n-aria="contextWindow.label" hidden>
                <span class="context-budget-ring" aria-hidden="true"></span>
                <span id="contextBudgetLabel"></span>
                <div class="context-budget-popover" role="tooltip">
                  <div class="context-budget-title" data-i18n="contextWindow.title"></div>
                  <div id="contextBudgetPercent"></div>
                  <div id="contextBudgetTokens"></div>
                  <div id="contextBudgetTokenizer"></div>
                  <div id="contextBudgetPolicy"></div>
                </div>
              </div>
            </div>
            <details class="option-menu model-menu">
              <summary class="option-summary" data-i18n-title="model.label">
                <span id="modelSummaryLabel"></span>
              </summary>
              <div class="option-popover option-popover-single" aria-label="Model" data-i18n-aria="model.label">
                <label class="select-field agent-select native-option-field">
                  <span class="sr-only" data-i18n="model.label"></span>
                  <select id="modelSelect" name="assistantModel" autocomplete="off" tabindex="-1" aria-hidden="true"></select>
                </label>
                <div class="option-list model-option-list" id="modelOptionList" role="menu"></div>
                <label class="custom-model-field" id="customModelField" hidden>
                  <span class="sr-only" data-i18n="model.custom"></span>
                  <input id="customModelInput" name="assistantCustomModel" autocomplete="off" spellcheck="false" data-i18n-placeholder="model.customPlaceholder">
                </label>
              </div>
            </details>
            <details class="option-menu permission-menu">
              <summary class="option-summary" data-i18n-title="permission.label">
                <svg class="claude-permission-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M6.2 8.2V3.8a1 1 0 0 1 2 0v3.7M8.2 7.5V3.1a1 1 0 0 1 2 0v4.7M10.2 8V4.4a1 1 0 1 1 2 0v5.3c0 2.3-1.8 4-4.1 4H7a3.5 3.5 0 0 1-2.8-1.4L2.5 10a1.1 1.1 0 0 1 1.6-1.5l1.2 1.2V5a1 1 0 0 1 2 0v3.2"/>
                </svg>
                <span id="permissionSummaryLabel"></span>
              </summary>
              <div class="option-popover option-popover-single" aria-label="Permission" data-i18n-aria="permission.label">
                <label class="select-field agent-select native-option-field">
                  <span class="sr-only" data-i18n="permission.label"></span>
                  <select id="permissionSelect" name="assistantPermission" autocomplete="off" tabindex="-1" aria-hidden="true"></select>
                </label>
                <div class="option-list permission-option-list" id="permissionOptionList" role="menu"></div>
              </div>
            </details>
            <details class="mode-menu">
              <summary class="mode-summary" data-i18n-title="agentMode.label">
                <span id="agentModeSummaryLabel"></span>
              </summary>
              <div class="mode-popover option-popover-single" aria-label="Provider agent" data-i18n-aria="agentMode.label">
                <label class="select-field agent-select native-option-field">
                  <span class="sr-only" data-i18n="agentMode.label"></span>
                  <select id="agentModeSelect" name="assistantAgentMode" autocomplete="off" tabindex="-1" aria-hidden="true"></select>
                </label>
                <div class="option-list mode-option-list" id="agentModeOptionList" role="menu"></div>
              </div>
            </details>
            <button class="composer-settings-button" id="composerSettingsBtn" type="button" data-i18n-title="action.settings" data-i18n-aria="action.settings" aria-label="Settings">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3 4h10M3 8h10M3 12h10"/>
                <path d="M6 2.8v2.4M10 6.8v2.4M7.5 10.8v2.4"/>
              </svg>
            </button>
            <select id="actionSelect" name="assistantAction" autocomplete="off" hidden>
              <option value="freeform" data-i18n="action.freeform"></option>
              <option value="explainSelection" data-i18n="action.explainSelection"></option>
              <option value="reviewFile" data-i18n="action.reviewFile"></option>
              <option value="generateTests" data-i18n="action.generateTests"></option>
              <option value="refactorSelection" data-i18n="action.refactorSelection"></option>
            </select>
          </div>

          <div class="prompt-tools" role="toolbar" aria-label="Quick actions" data-i18n-aria="quick.label">
            <button class="stop-button" id="stopBtn" data-i18n-title="action.stop" aria-label="Stop">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.1"/><rect class="stop-icon-square" x="6.15" y="6.15" width="3.7" height="3.7" rx="0.8"/></svg>
            </button>
            <button class="send-button" id="sendBtn" data-i18n-title="action.send" aria-label="Send">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V4M4 8l4-4 4 4"/></svg>
            </button>
          </div>
        </div>

        <div class="context-row">
          <details class="context-menu">
            <summary class="context-summary" data-i18n-title="context.label">
              <span class="chip-prefix">@</span><span id="contextSummaryLabel" data-i18n="context.short"></span>
            </summary>
            <div class="context-popover" aria-label="Context" data-i18n-aria="context.label">
              <label class="context-chip">
                <input type="checkbox" data-context="includeWorkspace" checked>
                <span class="chip-prefix">@</span><span data-i18n="context.workspace"></span>
              </label>
              <label class="context-chip">
                <input type="checkbox" data-context="includeCurrentFile" checked>
                <span class="chip-prefix">@</span><span data-i18n="context.file"></span>
              </label>
              <label class="context-chip">
                <input type="checkbox" data-context="includeSelection" checked>
                <span class="chip-prefix">@</span><span data-i18n="context.selection"></span>
              </label>
              <label class="context-chip">
                <input type="checkbox" data-context="includeDiagnostics" checked>
                <span class="chip-prefix">@</span><span data-i18n="context.problems"></span>
              </label>
            </div>
          </details>
        </div>
      </div>

      <div class="composer-footer">
        <div class="composer-runtime" data-i18n-aria="runtime.label" aria-label="Runtime">
          <details class="option-menu runtime-menu">
            <summary class="option-summary" data-i18n-title="runtime.label">
              <span id="runtimeSummaryLabel"></span>
            </summary>
            <div class="option-popover option-popover-single" aria-label="Runtime" data-i18n-aria="runtime.label">
              <label class="select-field agent-select native-option-field">
                <span class="sr-only" data-i18n="runtime.label"></span>
                <select id="runtimeSelect" name="assistantRuntime" autocomplete="off" tabindex="-1" aria-hidden="true"></select>
              </label>
              <div class="option-list runtime-option-list" id="runtimeOptionList" role="menu"></div>
            </div>
          </details>
        </div>
      </div>
    </footer>
  </div>

  <script nonce="__NONCE__" src="__I18N_JS_URI__"></script>
  <script nonce="__NONCE__" src="__MESSAGE_TEXT_JS_URI__"></script>
  <script nonce="__NONCE__" src="__MESSAGE_CHOICES_JS_URI__"></script>
  <script nonce="__NONCE__" src="__PROVIDER_RUN_STATE_JS_URI__"></script>
  <script nonce="__NONCE__" src="__PROVIDER_CAPABILITIES_JS_URI__"></script>
  <script nonce="__NONCE__" src="__CONVERSATION_STORE_JS_URI__"></script>
  <script nonce="__NONCE__" src="__SLASH_COMMANDS_JS_URI__"></script>
  <script nonce="__NONCE__" src="__OPEN_CODE_DIALOG_STATE_JS_URI__"></script>
  <script nonce="__NONCE__" src="__CLAUDE_ACTIONS_JS_URI__"></script>
  <script nonce="__NONCE__" src="__INLINE_MARKDOWN_JS_URI__"></script>
  <script nonce="__NONCE__" src="__MAIN_JS_URI__"></script>
</body>
</html>
